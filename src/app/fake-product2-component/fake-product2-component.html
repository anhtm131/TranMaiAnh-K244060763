<h3 class="text-center text-white bg-dark p-3 m-0 mb-4">Product List</h3>
<div *ngIf="errMessage" class="container">
    <div class="alert alert-danger">{{errMessage}}</div>
</div>
<div class="container pb-5">
    <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let p of data">
            <div class="card h-100">
                <div class="img-container">
                    <div class="d-flex justify-content-between align-items-center p-2 first">
                        <span class="percent">-25%</span>
                        <span class="wishlist"><i class="bi bi-heart-fill"></i></span>
                    </div>
                    <div class="text-center pt-4">
                        <img [src]="p.image" class="img-scale" alt="{{p.title}}">
                    </div>
                </div>
                <div class="product-detail-container mt-auto">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="mb-1 text-truncate fw-bold w-100" [title]="p.title">{{p.title}}</h6>
                    </div>
                    <div class="mb-1">
                        <span class="text-danger fw-bold">${{p.price}}</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <div class="ratings">
                            <span>{{p.rating?.rate}}</span>
                        </div>
                        <div class="count">Count: {{p.rating?.count}}</div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-warning d-block w-100 text-white fw-bold">Buy Now</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
